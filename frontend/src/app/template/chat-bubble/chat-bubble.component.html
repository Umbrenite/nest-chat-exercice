<div class="chat-bubble-container chat-{{isUserMessage}}"
  [class.user-message]="isUserMessage">
  <div class="bubble" [style.background-color]="chatBubbleColor" [style.color]="chatUsernameColor">
    <div class="message-header">
      <span class="username">{{username}}</span>
      <b class="timestamp" [style.color]="chatUsernameColor">{{ timestamp | date:'dd/MM/yyyy' }}</b>
    </div>
    <p class="message">{{ message }}</p>
  </div>
</div>

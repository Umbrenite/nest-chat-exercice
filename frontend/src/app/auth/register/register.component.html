<div class="auth-container">
    <h2>Inscription</h2>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <input type="text" placeholder="Nom d'utilisateur" formControlName="username" />
      <input type="email" placeholder="Email" formControlName="email" />
      <input type="password" placeholder="Mot de passe" formControlName="password" />
      <button type="submit" [disabled]="registerForm.invalid">S'inscrire</button>
    </form>
    <p class="switch-link">Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
  </div>

<div class="auth-container">
    <div class="errors-list" *ngIf="errorsList.length > 0">
      {{errorsList}}
    </div>
    <h2>Connexion</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <input id="email" type="email" placeholder="Email" formControlName="email" />
      <input type="password" placeholder="Mot de passe" formControlName="password" />
      <button type="submit" [disabled]="loginForm.invalid">Se connecter</button>
    </form>
    <p class="switch-link">Pas encore de compte ? <a routerLink="/register">Créer un compte</a></p>
  </div>
